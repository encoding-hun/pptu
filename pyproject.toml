[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "pptu"
description = "Python P2P Torrent Uploader"
version = "2026.10.24"
readme = "README.md"
authors = [{ name = "pcroland" }, { name = "varyg" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "beautifulsoup4<5.0.0,>=4.12.3",
    "guessit<5.0.0,>=4.1.0",
    "humanize<5.0.0,>=4.9.0",
    "langcodes<4.0.0,>=3.4.0",
    "lxml<7.0.0,>=6.0.1",
    "platformdirs<5.0.0,>=4.2.2",
    "pymediainfo<8.0.0,>=7.0.0",
    "pyotp<3.0.0,>=2.9.0",
    "pyoxipng<10.0.0,>=9.0.0",
    "pyrosimple<3.0.0,>=2.14.0",
    "rich<16.0.0,>=15.0.0",
    "toml<1.0.0,>=0.10.2",
    "torf<5.0.0,>=4.2.7",
    "pillow>=13.0.0",
    "cloup<4.0.0,>=3.0.7",
    "niquests[full,utls]>=3.15.2",
    "ordered-set<5.0.0,>=4.1.0",
    "orjson>=3.11.3",
    "beaupy>=3.10.2",
    "language-data>=1.3.0",
    "pymal-ng>=1.0.0",
]


[project.scripts]
pptu = "pptu.cli:main"

[project.urls]
Homepage = "https://github.com/encoding-hun/pptu"
Source = "https://github.com/encoding-hun/pptu"

[tool.uv]
managed = true

[tool.uv.build-backend]
module-root = "."

[dependency-groups]
dev = [
    "isort<6.0.0,>=5.10.1",
    "ruff<1.0.0,>=0.14.0",
    "ty<1.0.0,>=0.0.8",
    "mypy<2.0,>=1.17",
    "pep8-naming<1.0.0,>=0.13.2",
    "pre-commit<4.0.0,>=3.0.0",
    "pyupgrade<3.0.0,>=2.37.3",
    "types-attrs<20.0.0,>=19.1.0",
    "types-beautifulsoup4<5.0.0,>=4.11.6",
    "types-requests<3.0.0,>=2.28.10",
    "types-toml<1.0.0,>=0.10.8",
    "unify<1.0,>=0.5",
    "vulture<3.0,>=2.6",
    "yesqa<2.0.0,>=1.4.0",
]


[tool.isort]
classes = ["IO", "PPTU"]
line_length = 120
lines_after_imports = 2
profile = "black"

[tool.mypy]
exclude = [".venv"]
python_version = "3.11"
show_error_codes = true
strict = true
disallow_untyped_calls = false
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "guessit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "imdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymediainfo"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyrosimple.util.metafile"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torf"
ignore_missing_imports = true

[tool.vulture]
paths = ["."]
exclude = [".venv/"]
min_confidence = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "T20", "SIM", "ARG", "PTH"]
ignore = ["E501", "T201", "A004", "A001"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*)|([a-z0-9_]*_))$"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 90
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
